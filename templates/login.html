<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود — بعداً بخوانم</title>
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f42;
    --txt:#e7e9f0; --muted:#9aa2b8; --accent:#6d8bff; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(1200px 500px at 50% -10%, #1a2136 0%, var(--bg) 55%);
       color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
       "Vazirmatn",Helvetica,Arial,sans-serif;padding:20px}
  .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
       border-radius:16px;padding:28px 26px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  h1{font-size:20px;margin:0 0 4px;font-weight:700}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  p.sub code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  form{display:flex;flex-direction:column;gap:10px}
  input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
        border-radius:10px;padding:12px 14px;font-size:20px;letter-spacing:8px;text-align:center;
        font-variant-numeric:tabular-nums;direction:ltr}
  input:focus{outline:none;border-color:var(--accent)}
  input::placeholder{color:var(--muted);letter-spacing:0;font-size:13px}
  button{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;
         padding:12px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  .err{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);
       color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;margin:14px 0 0}
  .hint{color:var(--muted);font-size:12px;margin:16px 0 0;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>📚 بعداً بخوانم</h1>
  <p class="sub">در ربات بله دستور <code>/web</code> را بفرستید تا یک کد ۵ رقمی بگیرید و آن را اینجا وارد کنید.</p>
  <form method="post" action="{{ PREFIX }}/login">
    <input inputmode="numeric" autocomplete="one-time-code" name="code" maxlength="5"
           placeholder="کد ۵ رقمی" pattern="[0-9]{5}" required autofocus>
    <button type="submit">ورود</button>
  </form>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <p class="hint">کد فقط یک بار و تا ۱۰ دقیقه معتبر است.</p>
</div>
</body>
</html>
